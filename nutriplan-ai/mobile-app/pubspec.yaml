name: nutriplan_ai
description: A personalized nutrition planner using AI & ML for health tracking and dietary guidance.
publish_to: "none" # This is a private package, not published on pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0                # Rich fonts from Google Fonts
  flutter_svg: ^2.0.7                # SVG vector images support
  lottie: ^2.6.0                     # Animated vector graphics
  flutter_animate: ^4.2.0            # Easy and powerful animations
  animations: ^2.0.11                # Material motion widgets and animations
  
  # State Management & Navigation
  provider: ^6.1.2                   # Dependency injection & state management
  get: ^4.6.6                       # Lightweight navigation and state management

  # Firebase Core and Services
  firebase_core: ^2.31.0             # Firebase initialization
  firebase_auth: ^4.17.0             # Firebase Authentication
  cloud_firestore: ^4.15.0           # Firestore NoSQL database
  firebase_messaging: ^14.7.5        # Push notifications
  firebase_analytics: ^10.10.0       # Analytics for user behavior tracking

  # Storage & Preferences
  shared_preferences: ^2.2.2          # Local key-value storage
  flutter_secure_storage: ^9.0.0     # Secure encrypted storage for sensitive data

  # Networking & HTTP
  http: ^1.2.1                      # Basic HTTP requests
  dio: ^5.4.3+1                     # Advanced HTTP client with interceptors
  connectivity_plus: ^5.0.2          # Network connectivity status

  # Form Validation & Internationalization
  form_field_validator: ^1.1.0        # Validators for form inputs
  intl: ^0.19.0                      # Internationalization and date formatting

  # Charts & Data Visualization
  fl_chart: ^0.64.0                  # Lightweight and flexible charting library
  syncfusion_flutter_charts: ^25.1.41 # Rich, customizable charts from Syncfusion

  # Media & Utilities
  image_picker: ^1.1.2               # Pick images from gallery or camera
  path_provider: ^2.1.3              # Find commonly used locations on filesystem
  url_launcher: ^6.2.6               # Open URLs in browser or external apps
  fluttertoast: ^8.2.4               # Toast notifications

dev_dependencies:
  flutter_test:
    sdk: flutter                     # Unit and widget testing
  flutter_lints: ^3.0.1              # Recommended lint rules
  build_runner: ^2.4.8               # Code generation tool

flutter:
  uses-material-design: true          # Use Material UI components

  assets:
    - assets/images/                  # PNG, JPG image assets
    - assets/animations/              # JSON files for Lottie animations
    - assets/icons/                   # SVG or PNG icon assets
    - assets/fonts/                   # Custom font files

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600

